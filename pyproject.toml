[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mask4d"
version = "0.1.0"
description = "Mask4D with updated installation instruction"
readme = "README.md"
requires-python = "==3.8.*"

dependencies = [
    "click==8.1.7",
    "cumm-cu113>=0.4.11",
    "easydict==1.10",
    "filterpy==1.4.5",
    "numpy==1.24.4",
    "pytorch-lightning==1.5.9",
    "pyyaml==6.0.1",
    "scipy>=1.10.1",
    "spconv-cu113>=2.3.6",
    "timm==0.6.13",
    "torch==1.12.0+cu113",
    "torchvision==0.13.0+cu113",
    "torch-cluster==1.6.0+pt112cu113",
    "torch-scatter==2.1.0+pt112cu113",
    "torch-sparse==0.6.16+pt112cu113",
    "torch-geometric==1.7.2",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"

[tool.uv.sources]
torch = { index = "pytorch-cu113" }
torchvision = { index = "pytorch-cu113" }

[tool.uv]
find-links = [
  "https://data.pyg.org/whl/torch-1.12.0+cu113.html"
]
